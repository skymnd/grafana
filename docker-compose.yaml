services:
  grafana:
    image: grafana/grafana-enterprise:13.3.0@sha256:b400281ce086c56933813daa0b5767462644b0a742087af59915c05461235259
    container_name: grafana
    restart: unless-stopped
    env_file: .env
    networks:
      - proxy
    volumes:
      - grafana_storage:/var/lib/grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana-router.rule=Host(`grafana.${HOMELAB_DOMAIN}`)"
      - "traefik.http.routers.grafana-router.entrypoints=websecure"
      - "traefik.http.routers.grafana-router.tls.certresolver=le"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.grafana-router.service=grafana"

volumes:
  grafana_storage: {}

networks:
  proxy:
    external: true
